<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio</title>

  <!-- ✅ Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Optional: Custom style to make it look better */
    body {
      background-color: #f8f9fa;
    }
    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>

<body class="bg-light text-dark">

  <!-- ✅ Main Container -->
  <div class="container text-center p-5">

    <!-- Header Section -->
    <header class="mb-4">
      <h1 class="fw-bold">Madhvi Maheshwari</h1>
      <p class="text-muted">Aspiring Developer | Creative Designer | Tech Enthusiast</p>
    </header>

    <!-- Profile Image -->
    <img src="https://via.placeholder.com/180" alt="Profile Picture"
         class="img-fluid rounded-circle profile-img mb-3">

    <!-- Buttons -->
    <div class="mb-4">
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-secondary">Download CV</button>
    </div>

    <!-- Contact Form -->
    <div class="mt-4">
      <h5 class="fw-bold mb-3">Get in Touch</h5>
      <form class="mx-auto" style="max-width: 400px;">
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Your Email">
        <textarea class="form-control mb-3" rows="3" placeholder="Your Message"></textarea>
        <button type="submit" class="btn btn-success w-100">Send Message</button>
      </form>
    </div>

  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
