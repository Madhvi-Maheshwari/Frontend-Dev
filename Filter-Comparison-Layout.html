<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
<link rel="stylesheet" href="Filter-Comparison-Layout.css">
</head>
<body>

  <h1>Before & After Filter Comparison</h1>

  <div class="comparison">
    <div class="image-box">
      <img src="https://picsum.photos/id/1015/800/500" alt="Original Image">
      <div class="caption">Before (Original)</div>
    </div>

    <div class="image-box filtered">
      <img src="https://picsum.photos/id/1015/800/500" alt="Filtered Image">
      <div class="caption">After (Brightness + Contrast)</div>
    </div>
  </div>

</body>
</html>
