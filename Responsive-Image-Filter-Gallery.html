<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive-Image-Filter-Gallery.css">
</head>
<body>

  <h1>Responsive Image Filter Gallery</h1>

  <div class="gallery">
    <div class="gallery-item blur">
      <img src="https://picsum.photos/id/1015/400/300" alt="Blur Effect">
      <div class="caption">Blur Filter</div>
    </div>

    <div class="gallery-item grayscale">
      <img src="https://picsum.photos/id/1016/400/300" alt="Grayscale Effect">
      <div class="caption">Grayscale Filter</div>
    </div>

    <div class="gallery-item sepia">
      <img src="https://picsum.photos/id/1018/400/300" alt="Sepia Effect">
      <div class="caption">Sepia Filter</div>
    </div>

    <div class="gallery-item brightness">
      <img src="https://picsum.photos/id/1025/400/300" alt="Brightness Effect">
      <div class="caption">Brightness Filter</div>
    </div>

    <div class="gallery-item contrast">
      <img src="https://picsum.photos/id/1035/400/300" alt="Contrast Effect">
      <div class="caption">Contrast Filter</div>
    </div>

    <div class="gallery-item hue">
      <img src="https://picsum.photos/id/1040/400/300" alt="Hue Rotate Effect">
      <div class="caption">Hue-Rotate Filter</div>
    </div>
  </div>

</body>
</html>
