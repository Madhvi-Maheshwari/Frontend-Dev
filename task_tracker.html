<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>

  <!-- ✅ Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
  </style>
</head>

<body>
  <div class="container py-5">

    <!-- ✅ Header with Badge Counter -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">
        🗂 Task Tracker 
        <span class="badge bg-primary ms-2">5 Pending</span>
      </h2>
      <button class="btn btn-success">
        Completed <span class="badge bg-light text-success">2</span>
      </button>
    </div>

    <!-- ✅ Task List -->
    <ul class="list-group shadow-sm">

      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish Bootstrap Assignment
        <span class="badge bg-danger rounded-pill">High</span>
      </li>

      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update Portfolio Website
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>

      <li class="list-group-item d-flex justify-content-between align-items-center">
        Attend Team Meeting
        <span class="badge bg-success rounded-pill">Low</span>
      </li>

      <li class="list-group-item d-flex justify-content-between align-items-center">
        Design New Logo
        <span class="badge bg-danger rounded-pill">High</span>
      </li>

      <li class="list-group-item d-flex justify-content-between align-items-center">
        Submit Weekly Report
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>

    </ul>

  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
