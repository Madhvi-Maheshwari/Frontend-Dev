<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>

  <!-- ✅ Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Hover effect for product cards */
    .product-card {
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .product-img {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>

<body class="bg-light">

  <!-- ✅ Container -->
  <div class="container py-5">
    <h2 class="text-center mb-5 fw-bold">Our Products</h2>

    <div class="row g-4">
      <!-- Product 1 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/300x200" class="card-img-top product-img" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="text-muted mb-2">$59.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/300x200" class="card-img-top product-img" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p class="text-muted mb-2">$89.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/300x200" class="card-img-top product-img" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p class="text-muted mb-2">$39.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm">
          <img src="https://via.placeholder.com/300x200" class="card-img-top product-img" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Laptop Bag</h5>
            <p class="text-muted mb-2">$29.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
